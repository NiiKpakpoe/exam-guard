<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalex Institute of Technology</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.dit.edu.gh/">
<meta http-equiv="refresh" content="3; url=https://www.dit.edu.gh/">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #F5F6F7;
    color: #16191C;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
  }
  main { max-width: 34rem; text-align: center; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 .6rem; letter-spacing: -.01em; }
  p { margin: 0 0 1.4rem; color: #5A646E; }
  a.btn {
    display: inline-block;
    padding: .6rem 1.15rem;
    border-radius: 4px;
    background: #16191C;
    color: #FFF;
    text-decoration: none;
    font-size: .95rem;
    font-weight: 500;
  }
  a.btn:focus-visible { outline: 2px solid #16191C; outline-offset: 3px; }
  @media (prefers-color-scheme: dark) {
    body { background: #101315; color: #E9EDEF; }
    p { color: #9AA5AD; }
    a.btn { background: #E9EDEF; color: #101315; }
    a.btn:focus-visible { outline-color: #E9EDEF; }
  }
</style>
</head>
<body>
<main>
  <h1>This service is no longer available</h1>
  <p>The online examination service at this address has been retired. You&rsquo;re being redirected to the Dalex Institute of Technology website.</p>
  <a class="btn" href="https://www.dit.edu.gh/">Go to dit.edu.gh</a>
</main>
</body>
</html>
